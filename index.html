<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>POP! ART MACHINE</title>
<style>
:root{--ink:#111;--paper:#fff7e8;--yellow:#ffd400;--pink:#ff2d91;--cyan:#00d9ff;--red:#ff4136;--blue:#2357ff;--green:#48e06f;--panel:#f8efe1}
*{box-sizing:border-box}body{margin:0;font-family:Impact,Haettenschweiler,'Arial Narrow Bold',sans-serif;background:radial-gradient(circle at 20% 10%,#fff 0 8%,transparent 9%),linear-gradient(135deg,#ffd400 0 25%,#ff2d91 25% 50%,#00d9ff 50% 75%,#fff7e8 75%);background-size:34px 34px,100% 100%;color:var(--ink);min-height:100vh}
button,input,select{font:inherit}.machine{width:min(1500px,96vw);margin:18px auto;border:8px solid #111;border-radius:28px;background:#f8efe1;box-shadow:14px 14px 0 #111;overflow:hidden}.topbar{display:flex;align-items:center;gap:18px;padding:14px 20px;background:#ffd400;border-bottom:7px solid #111}.logo{font-size:clamp(28px,5vw,70px);letter-spacing:2px;transform:skew(-7deg);text-shadow:4px 4px 0 #fff,8px 8px 0 #ff2d91}.badge{margin-left:auto;background:#111;color:#fff;padding:9px 14px;border-radius:999px;font-family:Arial,sans-serif;font-weight:900}.layout{display:grid;grid-template-columns:340px minmax(0,1fr) 300px;min-height:720px}.panel{padding:16px;background:var(--panel)}.left{border-right:7px solid #111}.right{border-left:7px solid #111}.panel h2{margin:0 0 14px;background:#111;color:#fff;padding:8px 10px;transform:rotate(-1deg);font-size:22px}.drop{display:grid;place-items:center;min-height:150px;border:5px dashed #111;background:#fff;text-align:center;padding:18px;cursor:pointer;transition:.18s}.drop.drag{background:#00d9ff;transform:scale(1.02)}.drop strong{font-size:22px}.drop small{font-family:Arial,sans-serif;font-weight:700}.control{margin:14px 0}.control label{display:flex;justify-content:space-between;gap:8px;font-family:Arial,sans-serif;font-weight:900;font-size:14px;margin-bottom:5px}.control input[type=range]{width:100%;accent-color:#ff2d91}.control input[type=text],select{width:100%;border:4px solid #111;background:#fff;padding:9px;border-radius:0}.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mode,.action{border:4px solid #111;background:#fff;padding:10px 6px;box-shadow:4px 4px 0 #111;cursor:pointer}.mode.active{background:#00d9ff;transform:translate(3px,3px);box-shadow:1px 1px 0 #111}.stage{position:relative;display:grid;place-items:center;padding:24px;background-color:#fff;background-image:radial-gradient(#111 1.6px,transparent 1.6px);background-size:16px 16px;overflow:hidden}.frame{position:relative;width:min(100%,920px);aspect-ratio:4/3;border:10px solid #111;background:#fff;box-shadow:12px 12px 0 #ff2d91;overflow:hidden}.frame canvas{display:block;width:100%;height:100%;object-fit:contain}.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:30px;background:linear-gradient(135deg,#fff 0 50%,#ffd400 50%)}.empty b{font-size:clamp(42px,8vw,110px);line-height:.8;transform:rotate(-7deg);text-shadow:5px 5px 0 #ff2d91}.empty span{font-family:Arial,sans-serif;font-weight:900;margin-top:20px}.lamp-row{position:absolute;top:8px;display:flex;gap:12px}.lamp{width:22px;height:22px;border:4px solid #111;border-radius:50%;background:#ff4136}.lamp.on{background:#48e06f;box-shadow:0 0 16px #48e06f}.lever-wrap{display:grid;place-items:center;margin:8px 0 24px}.lever{position:relative;width:70px;height:170px;border:5px solid #111;background:#ddd;border-radius:40px;cursor:pointer}.lever:before{content:'';position:absolute;width:24px;height:105px;background:#111;left:18px;top:28px;transform-origin:bottom;transform:rotate(-18deg);transition:.25s}.lever:after{content:'';position:absolute;width:54px;height:54px;border:5px solid #111;border-radius:50%;background:#ff2d91;left:1px;top:0;transition:.25s}.lever.pull:before{transform:rotate(18deg)}.lever.pull:after{transform:translate(20px,80px)}.big{width:100%;font-size:23px;background:#ff2d91}.secondary{width:100%;background:#00d9ff;margin-top:10px}.mini{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.status{font-family:Arial,sans-serif;font-weight:800;font-size:13px;background:#fff;border:3px solid #111;padding:8px;margin-top:12px}.footer{font-family:Arial,sans-serif;font-weight:800;padding:10px 16px;border-top:7px solid #111;background:#111;color:#fff;text-align:center}.switch{display:flex;align-items:center;gap:8px;font-family:Arial,sans-serif;font-weight:900;margin:12px 0}.switch input{width:20px;height:20px;accent-color:#ff2d91}
@media(max-width:1050px){.layout{grid-template-columns:280px 1fr}.right{grid-column:1/-1;border-left:0;border-top:7px solid #111;display:grid;grid-template-columns:1fr 1fr;gap:15px}.lever-wrap{margin:0}.stage{min-height:520px}}
@media(max-width:720px){.machine{width:100%;margin:0;border-radius:0;border-left:0;border-right:0;box-shadow:none}.layout{display:flex;flex-direction:column}.left,.right{border:0;border-top:7px solid #111}.stage{order:-1;min-height:auto;padding:16px}.frame{width:100%}.right{display:block}.badge{display:none}}
</style>
</head>
<body>
<main class="machine">
<header class="topbar"><div class="logo">POP! ART MACHINE</div><div class="badge">LOKAAL • PRIVÉ • PNG</div></header>
<section class="layout">
<aside class="panel left">
<h2>1. VOER JE BEELD IN</h2>
<label class="drop" id="drop"><input id="file" type="file" accept="image/png,image/jpeg,image/webp" hidden><strong>DROP IT HERE!</strong><small>Sleep of klik voor JPG, PNG of WEBP</small></label>
<h2 style="margin-top:18px">2. KIES JE MACHINE</h2>
<div class="modes" id="modes">
<button class="mode active" data-mode="comic">COMIC</button><button class="mode" data-mode="warhol">WARHOL 4×</button>
<button class="mode" data-mode="halftone">HALFTONE</button><button class="mode" data-mode="poster">POSTER</button>
<button class="mode" data-mode="cmyk">CMYK SHIFT</button><button class="mode" data-mode="duotone">DUOTONE</button>
</div>
<div class="control"><label>Effectsterkte <output id="strengthOut">70</output></label><input id="strength" type="range" min="0" max="100" value="70"></div>
<div class="control"><label>Contrast <output id="contrastOut">125</output></label><input id="contrast" type="range" min="50" max="220" value="125"></div>
<div class="control"><label>Rastergrootte <output id="dotOut">7</output></label><input id="dot" type="range" min="3" max="18" value="7"></div>
<div class="control"><label>Kleurniveaus <output id="levelsOut">4</output></label><input id="levels" type="range" min="2" max="8" value="4"></div>
<label class="switch"><input id="live" type="checkbox" checked> LIVE MODE</label>
</aside>
<section class="stage">
<div class="lamp-row"><i class="lamp"></i><i class="lamp"></i><i class="lamp"></i></div>
<div class="frame"><canvas id="canvas" width="1200" height="900"></canvas><div class="empty" id="empty"><b>FEED<br>ME!</b><span>Upload een eigen afbeelding om de machine te starten.</span></div></div>
</section>
<aside class="panel right">
<h2>3. TREK AAN DE HENDEL</h2>
<div class="lever-wrap"><button class="lever" id="lever" aria-label="Activeer de pop-artmachine"></button></div>
<button class="action big" id="make">MAKE IT POP!</button>
<div class="control"><label for="caption">Striptekst</label><input id="caption" type="text" maxlength="22" placeholder="WOW! / BAM! / OEF!"></div>
<div class="control"><label for="palette">Kleurenpalet</label><select id="palette"><option value="classic">Classic Pop</option><option value="cmyk">CMYK Shock</option><option value="acid">Acid Candy</option><option value="random">Random Chaos</option></select></div>
<label class="switch"><input id="bubble" type="checkbox" checked> Tekstwolk toevoegen</label>
<button class="action secondary" id="random">SURPRISE ME</button>
<div class="mini"><button class="action" id="reset">RESET</button><button class="action" id="download">DOWNLOAD PNG</button></div>
<div class="status" id="status" aria-live="polite">Machine wacht op een afbeelding.</div>
</aside>
</section>
<footer class="footer">Alles gebeurt in je browser. Je afbeelding wordt niet geüpload naar een server.</footer>
</main>
<script>
(()=>{
const $=s=>document.querySelector(s), canvas=$('#canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true});let img=null,mode='comic',working=false;
const els={file:$('#file'),drop:$('#drop'),empty:$('#empty'),strength:$('#strength'),contrast:$('#contrast'),dot:$('#dot'),levels:$('#levels'),caption:$('#caption'),palette:$('#palette'),bubble:$('#bubble'),live:$('#live'),status:$('#status'),lever:$('#lever')};
const palettes={classic:['#ff2d91','#ffd400','#00d9ff','#2357ff','#fff7e8','#111111'],cmyk:['#00d9ff','#ff00a8','#ffe600','#111111','#ffffff','#ff4136'],acid:['#7cff00','#7b2cff','#ff6b00','#00ffd5','#ffef00','#111111']};
['strength','contrast','dot','levels'].forEach(k=>els[k].addEventListener('input',e=>{$('#'+k+'Out').value=e.target.value;if(els.live.checked&&img) render()}));
['caption','palette','bubble'].forEach(k=>els[k].addEventListener(k==='caption'?'input':'change',()=>{if(els.live.checked&&img)render()}));
$('#modes').addEventListener('click',e=>{const b=e.target.closest('.mode');if(!b)return;document.querySelectorAll('.mode').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode;if(img)render()});
els.file.addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(f)loadFile(f);});
['dragenter','dragover'].forEach(n=>els.drop.addEventListener(n,e=>{e.preventDefault();els.drop.classList.add('drag')}));['dragleave','drop'].forEach(n=>els.drop.addEventListener(n,e=>{e.preventDefault();els.drop.classList.remove('drag')}));els.drop.addEventListener('drop',e=>loadFile(e.dataTransfer.files[0]));
function loadFile(f){
if(!f||!/^image\//i.test(f.type)){status('Kies een geldige JPG, PNG of WEBP-afbeelding.');return}
if(f.size>20*1024*1024){status('Afbeelding is groter dan 20 MB. Kies een kleiner bestand.');return}
status('Afbeelding wordt ingelezen…');
const reader=new FileReader();
reader.onerror=()=>status('Het afbeeldingsbestand kon niet worden gelezen.');
reader.onload=()=>{const im=new Image();im.onload=()=>{img=im;els.empty.style.display='none';status('Beeld geladen. De machine is klaar!');render();els.file.value=''};im.onerror=()=>status('Deze afbeelding kon niet worden geopend. Gebruik JPG, PNG of WEBP.');im.src=reader.result};
reader.readAsDataURL(f)
}
function status(t){els.status.textContent=t}
function base(){const w=1200,h=900;canvas.width=w;canvas.height=h;ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);const sc=Math.max(w/img.width,h/img.height),dw=img.width*sc,dh=img.height*sc;ctx.drawImage(img,(w-dw)/2,(h-dh)/2,dw,dh)}
function palette(){if(els.palette.value==='random')return Array.from({length:6},()=>{const n=Math.floor(Math.random()*16777216);return '#'+n.toString(16).padStart(6,'0')});return palettes[els.palette.value]}
function render(){if(!img||working)return;working=true;status('RATATATA… beeld wordt verwerkt.');requestAnimationFrame(()=>{try{base();const p=palette(),s=+els.strength.value/100,c=+els.contrast.value/100,lev=+els.levels.value,d=+els.dot.value;if(mode==='warhol')warhol(p,lev,c);else if(mode==='halftone')halftone(p,d,c);else if(mode==='poster')pixels(p,lev,c,false);else if(mode==='duotone')pixels([p[5],p[0],p[2]],3,c,false);else if(mode==='cmyk')cmyk(Math.round(20*s),c);else comic(p,d,lev,c,s);if(els.bubble.checked&&els.caption.value.trim())bubble(els.caption.value.trim(),p);status('POP! Klaar om te downloaden.');flash()}catch(err){console.error(err);status('Bewerkingsfout: '+err.message)}finally{working=false}},0)}
function sourceData(){return ctx.getImageData(0,0,canvas.width,canvas.height)}
function lum(r,g,b,c=1){return Math.max(0,Math.min(255,((.299*r+.587*g+.114*b)-128)*c+128))}
function hex(h){h=h.replace('#','');if(h.length===3)h=[...h].map(x=>x+x).join('');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function pixels(p,levels,c,outline){const im=sourceData(),a=im.data,cols=p.map(hex);for(let i=0;i<a.length;i+=4){const l=lum(a[i],a[i+1],a[i+2],c),idx=Math.min(cols.length-1,Math.floor((255-l)/256*Math.min(levels,cols.length))),q=cols[idx];a[i]=q[0];a[i+1]=q[1];a[i+2]=q[2]}ctx.putImageData(im,0,0)}
function halftone(p,d,c){const src=sourceData();ctx.fillStyle=p[4]||'#fff';ctx.fillRect(0,0,canvas.width,canvas.height);for(let y=0;y<canvas.height;y+=d)for(let x=0;x<canvas.width;x+=d){const i=(Math.min(canvas.height-1,y)*canvas.width+Math.min(canvas.width-1,x))*4,l=lum(src.data[i],src.data[i+1],src.data[i+2],c),r=(1-l/255)*d*.68;if(r>.35){ctx.fillStyle=l<85?p[5]:l<170?p[0]:p[2];ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}}}
function comic(p,d,levels,c,s){const original=sourceData();pixels(p,levels,c);const colored=sourceData();const a=colored.data,o=original.data,w=canvas.width,h=canvas.height;for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){let i=(y*w+x)*4,l=lum(o[i],o[i+1],o[i+2]),lr=lum(o[i+4],o[i+5],o[i+6]),ld=lum(o[i+w*4],o[i+w*4+1],o[i+w*4+2]);if(Math.abs(l-lr)+Math.abs(l-ld)>55-(s*25)){a[i]=a[i+1]=a[i+2]=10}}ctx.putImageData(colored,0,0);const save=ctx.getImageData(0,0,w,h);const dots=document.createElement('canvas');dots.width=w;dots.height=h;const dc=dots.getContext('2d');dc.fillStyle='#fff';dc.fillRect(0,0,w,h);for(let yy=0;yy<h;yy+=d*2)for(let xx=0;xx<w;xx+=d*2){const ii=(Math.min(h-1,yy)*w+Math.min(w-1,xx))*4,ll=lum(o[ii],o[ii+1],o[ii+2],1),rr=(1-ll/255)*d*.75;if(rr>.5){dc.fillStyle='#111';dc.beginPath();dc.arc(xx,yy,rr,0,Math.PI*2);dc.fill()}}ctx.putImageData(save,0,0);ctx.globalCompositeOperation='multiply';ctx.globalAlpha=.18+s*.18;ctx.drawImage(dots,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over'}
function imageFromData(data){const c=document.createElement('canvas');c.width=data.width;c.height=data.height;c.getContext('2d').putImageData(data,0,0);return c}
function warhol(p,levels,c){const temp=document.createElement('canvas');temp.width=600;temp.height=450;const t=temp.getContext('2d');t.drawImage(canvas,0,0,600,450);const raw=t.getImageData(0,0,600,450);ctx.fillStyle='#111';ctx.fillRect(0,0,1200,900);for(let n=0;n<4;n++){t.putImageData(raw,0,0);const im=t.getImageData(0,0,600,450),a=im.data,cols=[p[(n+1)%p.length],p[(n+3)%p.length],p[(n+4)%p.length],p[5]].map(hex);for(let i=0;i<a.length;i+=4){const l=lum(a[i],a[i+1],a[i+2],c),q=cols[Math.min(cols.length-1,Math.floor((255-l)/256*cols.length))];a[i]=q[0];a[i+1]=q[1];a[i+2]=q[2]}t.putImageData(im,0,0);ctx.drawImage(temp,(n%2)*600,Math.floor(n/2)*450)}ctx.strokeStyle='#111';ctx.lineWidth=12;ctx.strokeRect(0,0,1200,900);ctx.beginPath();ctx.moveTo(600,0);ctx.lineTo(600,900);ctx.moveTo(0,450);ctx.lineTo(1200,450);ctx.stroke()}
function cmyk(off,c){const src=sourceData(),a=src.data,w=canvas.width,h=canvas.height;ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.globalCompositeOperation='multiply';[['#00d9ff',-off,0,0],['#ff00a8',off,0,1],['#ffe600',0,off,2]].forEach(([col,dx,dy,ch])=>{const layer=ctx.createImageData(w,h);for(let i=0;i<a.length;i+=4){let l=255-a[i+ch];layer.data[i]=hex(col)[0];layer.data[i+1]=hex(col)[1];layer.data[i+2]=hex(col)[2];layer.data[i+3]=l*c}ctx.putImageData(layer,dx,dy)});ctx.globalCompositeOperation='source-over'}
function bubble(text,p){ctx.save();ctx.translate(820,170);ctx.rotate(-.12);ctx.fillStyle='#fff';ctx.strokeStyle='#111';ctx.lineWidth=14;ctx.beginPath();for(let i=0;i<16;i++){const a=i/16*Math.PI*2,r=i%2?145:190,x=Math.cos(a)*r,y=Math.sin(a)*r*.65;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle=p[0];ctx.strokeStyle='#111';ctx.lineWidth=8;ctx.textAlign='center';ctx.textBaseline='middle';let size=Math.max(45,Math.min(105,620/text.length));ctx.font=`${size}px Impact`;ctx.strokeText(text.toUpperCase(),0,0,330);ctx.fillText(text.toUpperCase(),0,0,330);ctx.restore()}
function flash(){document.querySelectorAll('.lamp').forEach((l,i)=>setTimeout(()=>l.classList.toggle('on'),i*90));setTimeout(()=>document.querySelectorAll('.lamp').forEach(l=>l.classList.remove('on')),650)}
function activate(){if(!img){status('Eerst een afbeelding in de machine!');els.file.click();return}els.lever.classList.add('pull');setTimeout(()=>els.lever.classList.remove('pull'),450);render()}
$('#make').onclick=activate;els.lever.onclick=activate;
$('#random').onclick=()=>{const modes=['comic','warhol','halftone','poster','cmyk','duotone'];mode=modes[Math.floor(Math.random()*modes.length)];document.querySelectorAll('.mode').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));els.strength.value=25+Math.random()*75;els.contrast.value=90+Math.random()*110;els.dot.value=3+Math.random()*15;els.levels.value=2+Math.random()*6;els.palette.value=['classic','cmyk','acid','random'][Math.floor(Math.random()*4)];['strength','contrast','dot','levels'].forEach(k=>$('#'+k+'Out').value=Math.round(els[k].value));activate()};
$('#reset').onclick=()=>{if(img){mode='comic';els.strength.value=70;els.contrast.value=125;els.dot.value=7;els.levels.value=4;els.caption.value='';els.palette.value='classic';document.querySelectorAll('.mode').forEach(b=>b.classList.toggle('active',b.dataset.mode==='comic'));['strength','contrast','dot','levels'].forEach(k=>$('#'+k+'Out').value=els[k].value);render()}};
$('#download').onclick=()=>{if(!img){status('Er is nog geen kunstwerk om te downloaden.');return}const a=document.createElement('a');a.download='pop-art-machine.png';a.href=canvas.toDataURL('image/png');a.click();status('PNG gedownload!')};
})();
</script>
</body>
</html>
